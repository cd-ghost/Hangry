<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* General body styling */
        body {
            background: url('https://t4.ftcdn.net/jpg/05/30/94/15/360_F_530941532_cRnI3XVospM5knxsBSTE4VOy9LxbbUsf.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Header styling */
        header {
            background-color: #333;
            color: white;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        header h3 {
            margin: 0;
            font-size: 24px;
        }

        /* Navigation styling */
        nav {
            margin-top: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 16px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* Footer styling */
        footer {
            background-color: #333;
            color: white;
            padding: 5px;
            text-align: center;
            position: relative;
            width: 100%;
            bottom: 0;
        }

        /* Section styling */
        section {
            background: rgba(255, 255, 255, 0.9); /* Increased transparency */
            padding: 40px;
            margin: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            font-size: 28px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            color: #666;
        }

        /* Back to Top button styling */
        #back-to-top {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #0c0c0c;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: none; /* Hidden by default */
        }

        #back-to-top:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <header>
        <h3 style="display: inline;">HANGRY Payment Gateway</h3>
        <nav>
            <a href="/">Home</a>
            <a href="/orders/">Menu</a>
            <a href="#contact">Contact</a>
            <a href="#about">About</a>
        </nav>
    </header>
    <section>
        <h1>Payment Details</h1>
        <p>Please enter your payment details:</p>
        <form id="payment-form" onsubmit="return handlePayment(this);">
            {% csrf_token %}
            <label>Name on Card:</label>
            <input type="text" name="card_name" required autocomplete="cc-name"
                   pattern="[A-Za-z\s]+" title="Name should only contain letters and spaces"><br><br>

            <label>Card Number:</label>
            <input type="text" name="card_number" required autocomplete="cc-number"
                   inputmode="numeric" pattern="\d{13,19}" maxlength="19"
                   title="Enter a valid card number (13-19 digits)"
                   placeholder="XXXX XXXX XXXX XXXX"><br><br>

            <label>Expiry Date:</label>
            <input type="text" name="card_expiry" required autocomplete="cc-exp"
                   pattern="(0[1-9]|1[0-2])\/\d{2}" maxlength="5"
                   title="Enter expiry in MM/YY format" placeholder="MM/YY"><br><br>

            <label>CVV:</label>
            <input type="password" name="card_cvv" required autocomplete="cc-csc"
                   inputmode="numeric" pattern="\d{3,4}" maxlength="4"
                   title="Enter 3 or 4 digit CVV"><br><br>

            <p id="payment-error" style="color: red; display: none;"></p>
            <button type="submit">Submit Payment</button>
        </form>
        <script>
            function handlePayment(form) {
                var errorEl = document.getElementById('payment-error');
                errorEl.style.display = 'none';

                var cardNum = form.card_number.value.replace(/\s/g, '');
                if (!/^\d{13,19}$/.test(cardNum)) {
                    errorEl.textContent = 'Please enter a valid card number.';
                    errorEl.style.display = 'block';
                    return false;
                }

                var cvv = form.card_cvv.value;
                if (!/^\d{3,4}$/.test(cvv)) {
                    errorEl.textContent = 'Please enter a valid CVV.';
                    errorEl.style.display = 'block';
                    return false;
                }

                document.getElementById('thank-you').style.display = 'block';
                form.style.display = 'none';
                return false;
            }
        </script>

        <div id="thank-you" style="display: none; text-align: center; margin-top: 20px;">
            <h1>Thanks for ordering with HANGRY!</h1>
            <p>Your food will be delivered shortly. Enjoy your meal!</p>
        </div>
    </section>
    <footer>
        <p>&copy; 2025 HANGRY Restaurant. All rights reserved.</p>
    </footer>
</body>
</html>
